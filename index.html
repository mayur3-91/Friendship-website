<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Shravani</title><style>
body{margin:0;background:#000;color:#fff;font-family:Arial}#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(.45)}.o{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:-1}.c{max-width:760px;margin:24px auto;padding:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:20px;text-align:center}img{width:220px;border-radius:16px;border:4px solid #fff}video.m{width:90%;max-width:320px;margin:8px;border-radius:12px}button{padding:12px 20px;border:0;border-radius:30px;background:#ff4d8d;color:#fff}
</style></head><body><video id="bg" autoplay muted loop playsinline><source src="video1.mp4"></video><div class="o"></div><div class="c"><h1>💙 Happy Friendship Day, Shravani!</h1><h3>From Mayur 😊</h3><img src="cover.jpg"><p>🌸 Meeting you was one of my favorite plot twists.</p><p>😂 Friendship cancellation requests are rejected.</p><p>🍫 Late reply fine = One Dairy Milk.</p><p>❤️ Thank you for making ordinary days brighter.</p><audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" style="position:fixed;bottom:20px;right:20px;width:55px;height:55px;border-radius:50%;border:none;background:#ff4d8d;color:white;font-size:22px;z-index:9999;">🎵</button><h2>🎥 Memories</h2><video class="m" controls src="video2.mp4"></video><video class="m" controls src="video3.mp4"></video><br><button onclick="b()">🎉 Final Surprise</button><div id="e"></div></div><script>function b(){e.innerHTML="<h2>💖 Happy Friendship Day!</h2><p>I hope we keep laughing, talking and creating memories together.<br><b>– Mayur</b></p>";for(let i=0;i<80;i++){let d=document.createElement("div");d.innerHTML=["💙","💖","✨","🎉","🌸"][Math.floor(Math.random()*5)];d.style="position:fixed;left:"+Math.random()*100+"vw;top:-20px;font-size:28px";document.body.appendChild(d);let y=-20,x=parseFloat(d.style.left);let id=setInterval(()=>{y+=4;d.style.top=y+"px";d.style.left=(x+Math.sin(y/30)*10)+"px";if(y>innerHeight){clearInterval(id);d.remove()}},16);}}</script>
<script>
const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");
document.addEventListener("click",()=>{if(music)music.play().catch(()=>{});},{once:true});
if(btn&&music){
btn.addEventListener("click",()=>{
 if(music.paused){music.play();btn.textContent="⏸️";}
 else{music.pause();btn.textContent="🎵";}
});
}
</script>
</body></html>
