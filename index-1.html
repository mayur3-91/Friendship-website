<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Friendship Day</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.4);z-index:-2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:-1}
.container{max-width:760px;margin:20px auto;padding:20px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:18px;text-align:center}
.cover{width:220px;border-radius:18px;border:4px solid #fff}
video.mem{width:90%;max-width:320px;border-radius:12px;margin:10px}
#musicBtn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border:none;border-radius:50%;background:#ff4d8d;color:#fff;font-size:22px;cursor:pointer}
button{padding:12px 22px;border:none;border-radius:30px;background:#ff4d8d;color:#fff}
</style>
</head>
<body>
<video id="bg" autoplay muted loop playsinline><source src="video1.mp4"></video>
<div class="overlay"></div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">🎵</button>

<div class="container">
<h1>💙 Happy Friendship Day, Shravani! 💙</h1>
<h3>From Mayur 😊</h3>

<img src="cover.jpg" class="cover">

<p>🌸 Meeting you was one of my favorite plot twists.</p>
<p>😂 Friendship cancellation requests are rejected.</p>
<p>🍫 Late reply fine = One Dairy Milk.</p>
<p>❤️ Thank you for making ordinary days brighter.</p>

<h2>🎥 Memories</h2>
<video class="mem" controls src="video2.mp4"></video>
<video class="mem" controls src="video3.mp4"></video>

<br><br>
<button onclick="surprise()">🎉 Final Surprise</button>
<div id="msg"></div>
</div>

<script>
const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");

document.addEventListener("click",()=>{
 music.play().catch(()=>{});
},{once:true});

btn.onclick=()=>{
 if(music.paused){music.play();btn.innerHTML="⏸️";}
 else{music.pause();btn.innerHTML="🎵";}
};

function surprise(){
 document.getElementById("msg").innerHTML="<h2>💖 Happy Friendship Day!</h2><p>I hope we keep laughing, talking and creating memories together.<br><b>– Mayur</b></p>";
}
</script>
</body>
</html>
